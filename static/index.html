<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Databoarder</title>
<style>
  :root {
    --ink: #2d2a4a; --muted: #6b678f; --bg: #fff7e6; --card: #ffffff; --line: #e8e2f4;
    --purple: #7c5cff; --purple-soft: #ece7ff;
    --yellow: #ffd23f; --yellow-soft: #fff3c4;
    --green: #17c28b; --green-soft: #d6f7ea;
    --pink: #ff5c9d; --pink-soft: #ffe1ee;
    --blue: #3ec1ff; --blue-soft: #d9f2ff;
    --orange: #ff9f43; --orange-soft: #ffe8d0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink); font-size: 16px; line-height: 1.5; font-weight: 500;
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Quicksand", "Avenir Next", "Trebuchet MS", system-ui, sans-serif;
    background: var(--bg) radial-gradient(circle at 1px 1px, rgba(124,92,255,.16) 1.6px, transparent 0) 0 0 / 24px 24px;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 30px 18px 90px; }
  header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; margin-bottom: 24px; }
  h1 { font-size: 30px; margin: 0; font-weight: 900; letter-spacing: -.02em; }
  h1 .b { color: var(--purple); }
  .tagline { color: var(--muted); font-weight: 700; }
  .card { background: var(--card); border: 2.5px solid var(--ink); border-radius: 24px; padding: 20px 22px;
    box-shadow: 0 5px 0 var(--ink); margin-bottom: 22px; }
  .title { display: flex; align-items: center; gap: 12px; margin: 0 0 14px; font-size: 19px; font-weight: 900; }
  .ic { width: 42px; height: 42px; border-radius: 14px; display: inline-grid; place-items: center; font-size: 23px;
    border: 2.5px solid var(--ink); flex: none; }
  .ic.y { background: var(--yellow); } .ic.p { background: var(--purple-soft); } .ic.g { background: var(--green-soft); }
  .ic.b { background: var(--blue-soft); } .ic.k { background: var(--pink-soft); } .ic.o { background: var(--orange-soft); }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }
  .linkish { color: var(--purple); font-weight: 800; cursor: pointer; background: none; border: 0; padding: 0; font: inherit; font-weight: 800; }
  .linkish:hover { text-decoration: underline; }

  /* buttons */
  .btn { background: var(--purple); color: #fff; border: 2.5px solid var(--ink); border-radius: 16px; padding: 11px 22px;
    font: inherit; font-weight: 900; font-size: 16px; cursor: pointer; box-shadow: 0 4px 0 var(--ink); transition: transform .08s, box-shadow .08s; }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 5px 0 var(--ink); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .btn:disabled { opacity: .6; cursor: default; transform: none; }
  .btn.soft { background: var(--yellow); color: var(--ink); }
  .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-top: 16px; }

  /* drop zone */
  .drop { border: 3px dashed var(--purple); background: var(--purple-soft); border-radius: 20px; padding: 26px; text-align: center;
    cursor: pointer; transition: .15s; font-weight: 800; }
  .drop:hover, .drop.over { background: var(--yellow-soft); border-color: var(--ink); transform: rotate(-.4deg); }
  .drop .big { font-size: 42px; line-height: 1.1; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--yellow-soft); border: 2px solid var(--ink);
    border-radius: 999px; padding: 3px 12px; font-size: 14px; font-weight: 800; margin: 0 8px 6px 0; }

  /* modes */
  .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 700px) { .modes { grid-template-columns: 1fr; } }
  .mode { text-align: center; border: 2.5px solid var(--ink); border-radius: 20px; padding: 16px 12px 14px; cursor: pointer;
    background: #fff; color: var(--ink); font: inherit; transition: transform .1s, box-shadow .1s; box-shadow: 0 0 0 var(--ink); }
  .mode:hover { transform: translateY(-2px); }
  .mode .e { font-size: 38px; line-height: 1.1; display: block; }
  .mode b { font-size: 17px; font-weight: 900; display: block; margin-top: 4px; }
  .mode .d { font-size: 14px; color: var(--muted); font-weight: 700; }
  .mode.on { box-shadow: 0 5px 0 var(--ink); transform: translateY(-3px); }
  .mode[data-m=quick].on { background: var(--yellow-soft); } .mode[data-m=right_answer].on { background: var(--green-soft); }
  .mode[data-m=research].on { background: var(--blue-soft); }

  /* questions */
  .qopt { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border: 2.5px solid var(--line); border-radius: 18px;
    margin-bottom: 10px; cursor: pointer; background: #fff; transition: .1s; font-weight: 700; }
  .qopt:hover { border-color: var(--purple); }
  .qopt.on { border-color: var(--ink); background: var(--purple-soft); box-shadow: 0 3px 0 var(--ink); }
  .qopt input { accent-color: var(--purple); width: 18px; height: 18px; flex: none; }
  .qopt .em { font-size: 22px; }
  .qopt small { display: block; color: var(--muted); font-weight: 700; font-size: 12.5px; }
  textarea { width: 100%; min-height: 80px; resize: vertical; border: 2.5px solid var(--ink); border-radius: 16px; padding: 12px 14px;
    font: inherit; font-weight: 600; background: #fff; color: var(--ink); margin-top: 2px; }
  input[type=date] { width: 100%; padding: 8px 10px; border-radius: 12px; border: 2.5px solid var(--ink); background: #fff; color: var(--ink); font: inherit; font-weight: 700; }
  input[type=date].need { background: var(--yellow-soft); border-style: dashed; }
  textarea:focus, select:focus, input[type=date]:focus { outline: 3px solid var(--yellow); outline-offset: 1px; }
  .readback { font-size: 18px; font-weight: 800; background: var(--purple-soft); border: 2.5px solid var(--ink); border-radius: 18px; padding: 14px 16px; }
  .note { font-size: 14px; font-weight: 700; background: var(--orange-soft); border: 2px solid var(--ink); border-radius: 14px; padding: 7px 12px; margin-top: 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 14px; }
  label.f { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; font-weight: 800; }
  select { width: 100%; padding: 9px 10px; border-radius: 12px; border: 2.5px solid var(--ink); background: #fff; color: var(--ink); font: inherit; font-weight: 700; }
  .err { color: #c0245f; font-weight: 800; margin-top: 10px; }

  /* report */
  .reportbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .seg { display: inline-flex; gap: 6px; flex-wrap: wrap; }
  .seg button { border: 2.5px solid var(--ink); background: #fff; font: inherit; font-weight: 800; font-size: 14px; color: var(--ink);
    padding: 5px 14px; border-radius: 999px; cursor: pointer; }
  .seg button.on { background: var(--yellow); box-shadow: 0 3px 0 var(--ink); transform: translateY(-1px); }
  .assumed { font-size: 14px; font-weight: 700; background: #fff; border: 2.5px dashed var(--ink); border-radius: 16px; padding: 9px 14px; margin-bottom: 18px; }
  .verdict { display: flex; gap: 18px; align-items: center; border: 2.5px solid var(--ink); border-radius: 24px; padding: 22px;
    margin-bottom: 22px; box-shadow: 0 5px 0 var(--ink); }
  .verdict .face { font-size: 60px; line-height: 1; flex: none; }
  .verdict.clear_difference { background: var(--green-soft); } .verdict.no_clear_difference { background: var(--yellow-soft); }
  .verdict.blocked { background: var(--pink-soft); }
  .verdict h2 { margin: 0 0 6px; font-size: 26px; line-height: 1.15; font-weight: 900; letter-spacing: -.01em; }
  .verdict p { margin: 4px 0; font-weight: 700; }
  .verdict .sure { color: var(--muted); }
  @media (max-width: 560px) { .verdict { flex-direction: column; text-align: center; } }
  .banner { border: 2.5px solid var(--ink); border-radius: 20px; padding: 12px 18px; margin-bottom: 18px; font-weight: 800; }
  .banner.warn { background: var(--orange-soft); } .banner.good { background: var(--green-soft); }
  .banner ul { margin: 4px 0 0; padding-left: 20px; font-weight: 700; }
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 700px) { .charts { grid-template-columns: 1fr; } }
  .ct { font-weight: 900; margin: 0 0 4px; font-size: 15px; }
  .cap { font-size: 13px; color: var(--muted); font-weight: 700; margin-top: 4px; }
  svg text { fill: var(--muted); font: 700 12px ui-rounded, "Nunito", system-ui, sans-serif; }
  svg .lbl { fill: var(--ink); font-weight: 900; font-size: 13px; }

  /* tabs */
  .tabbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .tab { border: 2.5px solid var(--ink); background: #fff; font: inherit; font-weight: 800; font-size: 14px; color: var(--ink);
    padding: 6px 14px; border-radius: 999px; cursor: pointer; }
  .tab:hover { background: var(--purple-soft); }
  .tab.on { background: var(--yellow); box-shadow: 0 3px 0 var(--ink); transform: translateY(-1px); }
  .tabbar.sub .tab.on { background: var(--blue-soft); }
  .item { display: flex; gap: 10px; padding: 8px 0; border-bottom: 2px dashed var(--line); font-weight: 700; align-items: flex-start; }
  .item:last-child { border: 0; }
  .item .s { font-size: 18px; flex: none; width: 26px; text-align: center; }
  .item b { display: block; font-weight: 900; font-size: 14px; }
  .item small { display: block; color: var(--muted); font-weight: 700; font-size: 13px; }
  .box { background: var(--purple-soft); border: 2.5px solid var(--ink); border-radius: 18px; padding: 12px 16px; margin: 14px 0 0; font-weight: 700; }
  .box b { display: block; font-weight: 900; margin-bottom: 2px; }
  .box ul { margin: 4px 0 0; padding-left: 20px; }
  .caveats { background: var(--orange-soft); }
  .caveats ul { margin: 4px 0 0; padding-left: 22px; font-weight: 700; }
  .legend { font-size: 13px; color: var(--muted); font-weight: 800; margin-bottom: 8px; }
  .mblock { margin-bottom: 14px; }
  .mname { font-weight: 900; font-size: 15px; margin-bottom: 2px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; font-weight: 600; }
  th, td { text-align: left; padding: 8px 8px; border-bottom: 2px dashed var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 900; font-size: 12.5px; text-transform: uppercase; letter-spacing: .04em; }
  td.v { font-weight: 900; white-space: nowrap; }
  tr.flag td { background: var(--green-soft); }
  code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  code { background: var(--purple-soft); padding: 1px 6px; border-radius: 6px; word-break: break-word; }
  pre { background: #2d2a4a; color: #f3efff; padding: 14px; border-radius: 16px; overflow: auto; margin: 10px 0 0; max-height: 420px; }
  .fp { font-size: 13px; font-weight: 800; background: var(--yellow-soft); border: 2px solid var(--ink); border-radius: 14px; padding: 8px 12px; margin-bottom: 12px; word-break: break-word; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 3px solid currentColor; border-right-color: transparent;
    border-radius: 50%; animation: s .7s linear infinite; vertical-align: -2px; margin-right: 8px; }
  @keyframes s { to { transform: rotate(360deg); } }
  table.preview td, table.preview th { white-space: nowrap; font-size: 13px; }
  .scroll { overflow-x: auto; }
  .designs { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 12px; }
  .designs .mode { padding: 12px 10px; background: #fff; font: inherit; color: var(--ink); }
  .designs .mode .e { font-size: 30px; } .designs .mode b { font-size: 15px; }
  .designs .mode.on { background: var(--purple-soft); }
  .designs .mode:disabled { opacity: .4; cursor: not-allowed; transform: none; }
  .covchips { display: flex; flex-wrap: wrap; gap: 8px; }
  .covchip { display: inline-flex; gap: 6px; align-items: center; border: 2px solid var(--ink); border-radius: 999px; padding: 4px 12px;
    font-weight: 800; font-size: 13.5px; background: #fff; cursor: pointer; }
  .covchip.on { background: var(--green-soft); } .covchip input { accent-color: var(--ink); }
  .adj { font-size: 14px; font-weight: 800; margin: -6px 0 18px; }
  .adj .chip { margin: 2px 4px 2px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎈 Data<span class="b">boarder</span></h1>
    <div class="tagline">Ask. Get a straight answer.</div>
  </header>

  <section class="card" id="s1">
    <p class="title"><span class="ic y">📂</span> Your data</p>
    <div id="drop" class="drop">
      <div class="big">📄</div>
      <div>Drop a CSV here, or <button class="linkish" id="pick">browse</button></div>
      <input type="file" id="file" accept=".csv,text/csv" class="hidden">
    </div>
    <div id="fileinfo" class="hidden"></div>
    <div class="row" id="trysample"><span class="muted">No file?</span> <button class="linkish" id="sample">🛒 A/B test sample</button> · <button class="linkish" id="sample2">📅 Before/after sample</button> · <button class="linkish" id="sample3">🗺️ Pilot vs holdout sample</button> · <button class="linkish" id="sample4">💳 People chose sample</button></div>
    <div id="err1" class="err"></div>
  </section>

  <section class="card hidden" id="s2">
    <p class="title"><span class="ic g">🎚️</span> How careful?</p>
    <div class="modes" id="modes"></div>
  </section>

  <section class="card hidden" id="s2b">
    <p class="title"><span class="ic p">🧭</span> How did people get it?</p>
    <div class="designs" id="designs"></div>
  </section>

  <section class="card hidden" id="s3">
    <p class="title"><span class="ic b">💬</span> Your question</p>
    <div id="qlist"></div>
    <textarea id="qother" class="hidden" placeholder="Type your question…"></textarea>
    <div class="row"><button class="btn" id="go">Go</button></div>
    <div id="err3" class="err"></div>
  </section>

  <section class="card hidden" id="s4">
    <p class="title"><span class="ic k">👀</span> Is this right?</p>
    <div class="readback" id="readback"></div>
    <div id="notes"></div>
    <div class="row">
      <button class="btn" id="runbtn">✅ Yes, run it</button>
      <button class="linkish" id="adjust">✏️ Change</button>
    </div>
    <div class="grid hidden" id="adjustgrid">
      <div data-for="ab obs did"><label class="f">Group column</label><select id="f_group"></select></div>
      <div data-for="ab obs"><label class="f">Baseline</label><select id="f_control"></select></div>
      <div data-for="ab obs"><label class="f">New version</label><select id="f_treat"></select></div>
      <div data-for="did"><label class="f">Got the change</label><select id="f_treated"></select></div>
      <div data-for="did"><label class="f">Never got it</label><select id="f_comparison"></select></div>
      <div data-for="ba did"><label class="f">Date column</label><select id="f_date"></select></div>
      <div data-for="ba did"><label class="f">📅 Change happened on</label><input type="date" id="f_when"></div>
      <div><label class="f">Measure</label><select id="f_outcome"></select></div>
      <div data-for="ba did" id="agg_wrap"><label class="f">Each day uses</label><select id="f_agg"><option value="average">Its average</option><option value="total">Its total</option></select></div>
      <div data-for="obs" style="grid-column:1/-1"><label class="f">⚖️ Compare people who are alike on:</label><div class="covchips" id="covchips"></div></div>
    </div>
    <div id="err4" class="err"></div>
  </section>

  <div id="report" class="hidden"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MODES = {
  quick: { e: "⚡", title: "Quick and dirty", short: "Quick", desc: "Fast. Caveats at the end." },
  right_answer: { e: "🎯", title: "Need the right answer", short: "Right answer", desc: "Strict. Cross-checked." },
  research: { e: "🔬", title: "Research", short: "Research", desc: "Explore. Find ideas." },
};
const STATUS = { pass: "✅", warn: "⚠️", fail: "❌", info: "💡" };
const ASSUME = { ok: "✅", warn: "⚠️", manual: "🙋" };
const CHECK_EMOJI = { "Weeks of data": "🗓️", "Missing days": "📆", "Steady before": "📏", "Weeks related": "🔗", "Dates": "📅", "Sample size": "👥", "Missing results": "🕳️", "Missing balance": "⚖️", "Repeat people": "🔂", "Group balance": "⚖️", "Extreme values": "🏔️", "Question fits data": "🧩", "Groups alike": "🎲", "Groups differ": "⚖️", "Comparable people": "🤝", "Comparison group": "🧑‍🤝‍🧑" };
const KIND = { ab_test: "ab", before_after: "ba", diff_in_diff: "did", observational: "obs" };
const kindOf = (spec) => KIND[spec && spec.analysis_type] || "ab";
const isDated = (spec) => ["ba", "did"].includes(kindOf(spec));
const state = { ds: null, design: null, tapped: false, mode: "quick", questions: [], choice: 0, spec: null, readback: "", assumed: false };

async function api(path, opts) {
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || "Something went wrong.");
  return data;
}
const post = (path, body) => api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
function busy(btn, on, text) { btn.disabled = on; if (on) { btn.dataset.t = btn.dataset.t || btn.textContent; btn.innerHTML = `<span class="spin"></span>${text}`; } else { btn.textContent = btn.dataset.t || btn.textContent; delete btn.dataset.t; } }

/* ---------- 1 data ---------- */
$("pick").onclick = () => $("file").click();
$("drop").onclick = (e) => { if (e.target.id !== "pick") $("file").click(); };
$("file").onchange = (e) => e.target.files[0] && upload(e.target.files[0]);
["dragover", "dragenter"].forEach((t) => $("drop").addEventListener(t, (e) => { e.preventDefault(); $("drop").classList.add("over"); }));
["dragleave", "drop"].forEach((t) => $("drop").addEventListener(t, (e) => { e.preventDefault(); $("drop").classList.remove("over"); }));
$("drop").addEventListener("drop", (e) => e.dataTransfer.files[0] && upload(e.dataTransfer.files[0]));
const loadSample = (name) => async () => {
  const blob = await (await fetch("/static/" + name)).blob();
  upload(new File([blob], name, { type: "text/csv" }));
};
$("sample").onclick = loadSample("checkout_test.csv");
$("sample2").onclick = loadSample("signup_page_change.csv");
$("sample3").onclick = loadSample("regional_rollout.csv");
$("sample4").onclick = loadSample("loyalty_program.csv");

async function upload(file) {
  $("err1").textContent = "";
  const fd = new FormData(); fd.append("file", file);
  try { state.ds = await api("/api/upload", { method: "POST", body: fd }); }
  catch (e) { $("err1").textContent = "😕 " + e.message; return; }
  const d = state.ds, cols = d.columns.map((c) => c.name);
  $("drop").classList.add("hidden"); $("trysample").classList.add("hidden");
  $("fileinfo").classList.remove("hidden");
  $("fileinfo").innerHTML = `<span class="chip">📄 ${esc(d.name)}</span><span class="chip">${d.rows.toLocaleString()} rows</span><span class="chip">${cols.length} columns</span>
    <button class="linkish" id="togglePrev">👀 Peek</button> · <button class="linkish" id="swap">🔄 Other file</button>
    <div id="prev" class="scroll hidden" style="margin-top:12px"><table class="preview"><thead><tr>${cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead>
    <tbody>${d.preview.map((r) => `<tr>${cols.map((c) => `<td>${esc(r[c])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  $("togglePrev").onclick = () => $("prev").classList.toggle("hidden");
  $("swap").onclick = () => location.reload();
  $("s2").classList.remove("hidden"); $("s2b").classList.remove("hidden"); $("s3").classList.remove("hidden");
  renderModes(); renderDesigns(); await loadQuestions();
}

/* ---------- 2 mode ---------- */
function renderModes() {
  $("modes").innerHTML = Object.entries(MODES).map(([k, m]) => `
    <button class="mode ${state.mode === k ? "on" : ""}" data-m="${k}" aria-pressed="${state.mode === k}">
      <span class="e">${m.e}</span><b>${esc(m.title)}</b><span class="d">${esc(m.desc)}</span></button>`).join("");
  $("modes").querySelectorAll(".mode").forEach((b) => (b.onclick = async () => { state.mode = b.dataset.m; renderModes(); renderDesigns(); await loadQuestions(); }));
}

/* ---------- 2b design ---------- */
const curDesign = () => (state.tapped ? state.design : state.mode === "quick" ? state.ds.designs.default : null);
const designInfo = (key) => (state.ds.designs.options.find((o) => o.key === key) || {});
function renderDesigns() {
  const cur = curDesign(), inferred = cur && !state.tapped;
  $("designs").innerHTML = state.ds.designs.options.map((o) => `
    <button class="mode ${cur === o.key ? "on" : ""}" data-d="${o.key}" ${o.ok ? "" : "disabled"} title="${esc(o.why)}" aria-pressed="${cur === o.key}">
      <span class="e">${o.emoji}</span><b>${esc(o.title)}</b><span class="d">${esc(o.sub)}</span>${inferred && cur === o.key ? '<span class="d">👀 best guess</span>' : ""}</button>`).join("");
  $("designs").querySelectorAll(".mode").forEach((b) => (b.onclick = async () => { state.design = b.dataset.d; state.tapped = true; renderDesigns(); state.choice = 0; await loadQuestions(); }));
}

/* ---------- 3 question ---------- */
async function loadQuestions() {
  const keep = state.choice;
  const d = curDesign();
  state.questions = d ? (await api(`/api/suggestions?dataset_id=${state.ds.dataset_id}&mode=${state.mode}&design=${d}`)).questions : [];
  state.choice = keep === "other" || keep >= state.questions.length ? (state.questions.length ? 0 : "other") : keep;
  renderQuestions();
}
function renderQuestions() {
  const items = state.questions.map((q, i) => ({ id: i, em: q.needs_date ? "📅" : designInfo(curDesign()).emoji || "📈", text: q.text, sub: i === 0 ? "Suggested" : "" }));

$("go").onclick = async () => {

/* ---------- 4 confirm ---------- */
const fillSelect = (sel, values, cur) => (sel.innerHTML = values.map((v) => `<option ${v === cur ? "selected" : ""}>${esc(v)}</option>`).join(""));
const levelsFor = async (col) => (await api(`/api/levels?dataset_id=${state.ds.dataset_id}&column=${encodeURIComponent(col)}`)).values;

  state.assumed = false;
  $("s4").classList.remove("hidden");
  $("readback").textContent = state.readback;
  $("notes").innerHTML = notes.map((n) => `<div class="note">💡 ${esc(n)}</div>`).join("");
  const s = state.spec, cols = state.ds.columns.map((c) => c.name), numeric = state.ds.columns.filter((c) => c.type === "number").map((c) => c.name);
  const k = kindOf(s);
  document.querySelectorAll("#adjustgrid [data-for]").forEach((el) => el.classList.toggle("hidden", !el.dataset.for.split(" ").includes(k)));
  fillSelect($("f_outcome"), numeric, s.outcome_col);
  if (isDated(s)) {
    const dates = state.ds.columns.filter((c) => c.type === "date");
    fillSelect($("f_date"), dates.map((c) => c.name), s.date_col);
    $("f_agg").value = s.aggregate || "average";

    $("f_when").value = s.change_date || "";
    $("f_when").classList.toggle("need", !s.change_date);
  }

    else { fillSelect($("f_control"), lv, s.control); fillSelect($("f_treat"), lv, s.treatment); }
  }
  if (k === "obs") await loadCovs(s.covariates);
  $("adjustgrid").classList.toggle("hidden", !(isDated(s) || k === "obs") && $("adjustgrid").classList.contains("hidden"));

  $("s4").scrollIntoView({ behavior: "smooth", block: "nearest" });
}
async function loadCovs(checked) {
  const q = new URLSearchParams({ dataset_id: state.ds.dataset_id, group_col: $("f_group").value, control: $("f_control").value, treatment: $("f_treat").value, outcome_col: $("f_outcome").value });
  let cands = [];
  try { cands = (await api("/api/covariates?" + q)).columns; } catch (e) {}
  $("covchips").innerHTML = cands.length ? cands.map((c) => {
    const on = checked ? checked.includes(c.name) : c.checked;
    return `<label class="covchip ${on ? "on" : ""}" title="${esc(c.note || "")}"><input type="checkbox" value="${esc(c.name)}" ${on ? "checked" : ""}>${esc(c.name)}</label>`;
  }).join("") : '<span class="muted">No other columns to compare on.</span>';
  $("covchips").querySelectorAll("input").forEach((i) => (i.onchange = () => { i.parentElement.classList.toggle("on", i.checked); specChanged(false); }));
}
function setDateBounds() {
  const c = state.ds.columns.find((x) => x.name === $("f_date").value) || {};
  $("f_when").min = c.date_min || ""; $("f_when").max = c.date_max || "";
  $("agg_wrap").classList.toggle("off", !(c.rows_per_day > 1.05));
  $("agg_wrap").style.display = c.rows_per_day > 1.05 && isDated(state.spec) ? "" : "none";
}
$("adjust").onclick = () => $("adjustgrid").classList.toggle("hidden");
async function specChanged(groupChanged) {
  const k = kindOf(state.spec), outcome = $("f_outcome").value;
  if (k === "ba" || k === "did") {
    if (groupChanged) setDateBounds();
    const agg = $("agg_wrap").style.display === "none" ? "average" : $("f_agg").value;
    const base = { date_col: $("f_date").value, change_date: $("f_when").value, outcome_col: outcome, aggregate: agg };
    $("f_when").classList.toggle("need", !base.change_date);
    if (k === "ba") state.spec = { analysis_type: "before_after", ...base };
    else {
      if (groupChanged === "group") { const lv = await levelsFor($("f_group").value); fillSelect($("f_comparison"), lv, lv[0]); fillSelect($("f_treated"), lv, lv[1] || lv[0]); }
      state.spec = { analysis_type: "diff_in_diff", ...base, group_col: $("f_group").value, treated: $("f_treated").value, comparison: $("f_comparison").value };
    }
  } else {
    if (groupChanged === "group") { const lv = await levelsFor($("f_group").value); fillSelect($("f_control"), lv, lv[0]); fillSelect($("f_treat"), lv, lv[1] || lv[0]); }
    state.spec = { analysis_type: state.spec.analysis_type, group_col: $("f_group").value, control: $("f_control").value, treatment: $("f_treat").value, outcome_col: outcome };
    if (k === "obs") {
      state.spec.assignment = state.spec.assignment || "chose";
      if (groupChanged) await loadCovs(null);
      state.spec.covariates = [...$("covchips").querySelectorAll("input:checked")].map((i) => i.value);
    }
  }
  try { state.readback = (await post("/api/readback", { dataset_id: state.ds.dataset_id, spec: state.spec })).readback; $("readback").textContent = state.readback; } catch (e) {}
}
$("f_group").onchange = () => specChanged("group");
$("f_date").onchange = () => specChanged(true);
$("f_outcome").onchange = () => specChanged(kindOf(state.spec) === "obs" ? true : false);
["f_control", "f_treat", "f_treated", "f_comparison", "f_when", "f_agg"].forEach((id) => ($(id).onchange = () => specChanged(id === "f_control" || id === "f_treat" ? (kindOf(state.spec) === "obs" ? true : false) : false)));
$("runbtn").onclick = async () => {
  $("err4").textContent = "";
  if (isDated(state.spec) && !state.spec.change_date) { $("err4").textContent = "📅 Pick the date the change happened first."; $("f_when").focus(); return; }
  busy($("runbtn"), true, "Crunching…"); try { await run(); } catch (e) { $("err4").textContent = "😕 " + e.message; } busy($("runbtn"), false);
};

async function run() {

/* ---------- charts ---------- */
function ticks(lo, hi, n = 4) {
  const span = hi - lo, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
  const step = (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * mag, out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toPrecision(10));
  return out;
}
function intervalChart(rows, o) {
  const W = 400, rowH = 56, padL = 122, padR = 16, padT = 8, padB = 30, H = padT + padB + rows.length * rowH;
  let lo = Math.min(...rows.map((r) => r.lo), o.zero ? 0 : Infinity), hi = Math.max(...rows.map((r) => r.hi), o.zero ? 0 : -Infinity);
  const pad = (hi - lo) * 0.12 || 1; lo -= pad; hi += pad;
  if (o.floor0 && lo < 0) lo = 0;
  const x = (v) => padL + ((v - lo) / (hi - lo)) * (W - padL - padR);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.aria)}">`;
  ticks(lo, hi).forEach((t) => { s += `<line x1="${x(t)}" x2="${x(t)}" y1="${padT}" y2="${H - padB}" stroke="var(--line)" stroke-width="2"/><text x="${x(t)}" y="${H - 10}" text-anchor="middle">${o.fmt(t)}</text>`; });
  if (o.zero) s += `<line x1="${x(0)}" x2="${x(0)}" y1="${padT}" y2="${H - padB}" stroke="var(--ink)" stroke-width="2.5" stroke-dasharray="5 4"/>`;
  rows.forEach((r, i) => {
    const y = padT + i * rowH + rowH / 2;
    s += `<text class="lbl" x="${padL - 10}" y="${y + 4}" text-anchor="end">${esc(r.label.length > 14 ? r.label.slice(0, 13) + "…" : r.label)}</text>
      <line x1="${x(r.lo)}" x2="${x(r.hi)}" y1="${y}" y2="${y}" stroke="${r.color}" stroke-width="7" stroke-linecap="round"/>
      <circle cx="${x(r.est)}" cy="${y}" r="9" fill="${r.color}" stroke="var(--ink)" stroke-width="2.5"/>
      <text x="${x(r.est)}" y="${y - 15}" text-anchor="middle" class="lbl">${o.fmt(r.est)}</text>`;
  });
  return s + "</svg>";
}

function dayLabel(iso) { const [y, m, d] = iso.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" }); }
function seriesChart(sr, m, fmt) {
  const W = 760, H = 290, padL = 54, padR = 18, padT = 26, padB = 34, n = sr.dates.length;
  const vals = sr.values.map((v) => (v == null ? null : v * m)), sm = sr.smooth.map((v) => (v == null ? null : v * m));
  const bm = sr.before_mean * m, am = sr.after_mean * m;
  const all = vals.filter((v) => v != null).concat([bm, am]);
  let lo = Math.min(...all), hi = Math.max(...all); const pad = (hi - lo) * 0.1 || 1; lo -= pad; hi += pad;
  const x = (i) => padL + (i / Math.max(n - 1, 1)) * (W - padL - padR), y = (v) => padT + (1 - (v - lo) / (hi - lo)) * (H - padT - padB);
  const ci = sr.dates.indexOf(sr.change_date);
  const from = sr.before_from ? sr.dates.indexOf(sr.before_from) : 0, to = sr.after_to ? sr.dates.indexOf(sr.after_to) : n - 1;
  let g = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Daily values over time with the change date marked">`;
  ticks(lo, hi, 4).forEach((t) => { g += `<line x1="${padL}" x2="${W - padR}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="2"/><text x="${padL - 8}" y="${y(t) + 4}" text-anchor="end">${fmt(t)}</text>`; });
  const xt = 5; for (let k = 0; k <= xt; k++) { const i = Math.round((k / xt) * (n - 1)); g += `<text x="${x(i)}" y="${H - 10}" text-anchor="${k === 0 ? "start" : k === xt ? "end" : "middle"}">${dayLabel(sr.dates[i])}</text>`; }
  vals.forEach((v, i) => { if (v != null) g += `<circle cx="${x(i)}" cy="${y(v)}" r="2.6" fill="${i < ci ? "var(--orange)" : "var(--purple)"}" opacity=".28"/>`; });
  const path = (a, b, color) => {   // smoothed line, broken at gaps
    let d = "", pen = false;
    for (let i = a; i < b; i++) { if (sm[i] == null) { pen = false; continue; } d += `${pen ? "L" : "M"}${x(i).toFixed(1)} ${y(sm[i]).toFixed(1)}`; pen = true; }
    return `<path d="${d}" fill="none" stroke="${color}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  };
  g += path(0, ci, "var(--orange)") + path(ci, n, "var(--purple)");
  g += `<line x1="${x(from)}" x2="${x(ci)}" y1="${y(bm)}" y2="${y(bm)}" stroke="var(--ink)" stroke-width="2.5" stroke-dasharray="2 5" stroke-linecap="round"/>
        <line x1="${x(ci)}" x2="${x(to)}" y1="${y(am)}" y2="${y(am)}" stroke="var(--ink)" stroke-width="2.5" stroke-dasharray="2 5" stroke-linecap="round"/>
        <text class="lbl" x="${x(from) + 4}" y="${y(bm) - 8}">${fmt(bm)}</text><text class="lbl" x="${x(to) - 4}" y="${y(am) - 8}" text-anchor="end">${fmt(am)}</text>
        <line x1="${x(ci)}" x2="${x(ci)}" y1="${padT - 4}" y2="${H - padB}" stroke="var(--ink)" stroke-width="2.5" stroke-dasharray="5 4"/>
        <text class="lbl" x="${x(ci)}" y="${padT - 10}" text-anchor="middle">📅 ${dayLabel(sr.change_date)}</text>`;
  return g + "</svg>";
}

function didChart(sr, m, fmt) {
  const W = 760, H = 290, padL = 54, padR = 18, padT = 26, padB = 34, n = sr.dates.length, cols = ["var(--purple)", "var(--orange)"];
  const sm = sr.groups.map((g) => g.smooth.map((v) => (v == null ? null : v * m))), raw = sr.groups.map((g) => g.values.map((v) => (v == null ? null : v * m)));
  const all = raw.flat().concat(sm.flat()).filter((v) => v != null);
  let lo = Math.min(...all), hi = Math.max(...all); const pad = (hi - lo) * 0.1 || 1; lo -= pad; hi += pad;
  const x = (i) => padL + (i / Math.max(n - 1, 1)) * (W - padL - padR), y = (v) => padT + (1 - (v - lo) / (hi - lo)) * (H - padT - padB);
  const ci = sr.dates.indexOf(sr.change_date);
  let g = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Each group's daily value over time with the change date marked">`;
  ticks(lo, hi, 4).forEach((t) => { g += `<line x1="${padL}" x2="${W - padR}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="2"/><text x="${padL - 8}" y="${y(t) + 4}" text-anchor="end">${fmt(t)}</text>`; });
  const xt = 5; for (let k = 0; k <= xt; k++) { const i = Math.round((k / xt) * (n - 1)); g += `<text x="${x(i)}" y="${H - 10}" text-anchor="${k === 0 ? "start" : k === xt ? "end" : "middle"}">${dayLabel(sr.dates[i])}</text>`; }
  raw.forEach((vals, gi) => vals.forEach((v, i) => { if (v != null) g += `<circle cx="${x(i)}" cy="${y(v)}" r="2.2" fill="${cols[gi]}" opacity=".2"/>`; }));
  sm.forEach((vals, gi) => {
    let d = "", pen = false;
    vals.forEach((v, i) => { if (v == null) { pen = false; return; } d += `${pen ? "L" : "M"}${x(i).toFixed(1)} ${y(v).toFixed(1)}`; pen = true; });
    g += `<path d="${d}" fill="none" stroke="${cols[gi]}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    const last = [...vals].reverse().find((v) => v != null);
    if (last != null) g += `<text class="lbl" x="${W - padR}" y="${y(last) - 8}" text-anchor="end" fill="${cols[gi]}">${esc(sr.groups[gi].name)}</text>`;
  });
  g += `<line x1="${x(ci)}" x2="${x(ci)}" y1="${padT - 4}" y2="${H - padB}" stroke="var(--ink)" stroke-width="2.5" stroke-dasharray="5 4"/>
        <text class="lbl" x="${x(ci)}" y="${padT - 10}" text-anchor="middle">📅 ${dayLabel(sr.change_date)}</text>`;
  return g + "</svg>";
}

/* ---------- tabs ---------- */
function bindTabs(root) {

/* ---------- report ---------- */
function renderReport(r) {
  const root = $("report"); root.classList.remove("hidden");
  const ok = r.verdict !== "blocked";
  const face = { clear_difference: "🎉", no_clear_difference: "🤷", blocked: "🚧" }[r.verdict];
  const pts = r.effect ? r.effect.unit_pts : true, m = pts ? 100 : 1;
  const num = (v) => (Math.abs(v) >= 100 ? Math.round(Math.abs(v)).toLocaleString() : Math.abs(v).toFixed(2));
  const f1 = (v) => (pts ? v.toFixed(1) + "%" : Math.abs(v) >= 100 ? Math.round(v).toLocaleString() : v.toFixed(2));
  const fd = (v) => (v > 0 ? "+" : v < 0 ? "−" : "") + (pts ? Math.abs(v).toFixed(1) + " pts" : num(v));
  const item = (s, title, sub) => `<div class="item"><span class="s">${s}</span><div><b>${esc(title)}</b>${sub ? `<small>${esc(sub)}</small>` : ""}</div></div>`;

  let h = `<div class="reportbar"><div class="seg" role="group" aria-label="Rerun in another mode">${Object.entries(MODES).map(([k, mo]) =>
      `<button data-rm="${k}" class="${r.mode === k ? "on" : ""}">${mo.e} ${esc(mo.short)}</button>`).join("")}</div></div>`;

  const di = designInfo(r.design);
  if (r.design && di.title) h += `<div style="margin-bottom:14px"><span class="chip">🧭 ${di.emoji} ${esc(di.title)}</span></div>`;
  if (state.assumed) h += `<div class="assumed">👀 Assumed: ${state.tapped ? "" : esc((di.emoji || "") + " " + (di.title || "") + " · ")}${esc(state.readback)} <button class="linkish" id="change">✏️ Change</button></div>`;

  if (r.mode === "right_answer" && ok) {
    h += r.review_items.length
      ? `<div class="banner warn">⚠️ Check first<ul>${r.review_items.map((t) => `<li>${esc(t)}</li>`).join("")}</ul></div>`
      : `<div class="banner good">🏅 All checks clean. ${esc(r.robust_summary.replace(/^Holds up( so far)?:\s*/, "").replace(/^./, (c) => c.toUpperCase()))}</div>`;
  }

  h += `<div class="verdict ${r.verdict}"><div class="face">${face}</div><div><h2>${esc(r.headline)}</h2><p>${esc(r.answer)}</p>${r.how_sure ? `<p class="sure">${esc(r.how_sure)}</p>` : ""}</div></div>`;

  if (r.adjusted_for && r.adjusted_for.length) h += `<div class="adj">⚖️ Compared people alike on: ${r.adjusted_for.map((c) => `<span class="chip">${esc(c)}</span>`).join("")}</div>`;

  if (ok) {
    const did = r.analysis === "diff_in_diff", armFmt = did ? fd : f1;
    const arms = r.arms.map((a, i) => ({ label: a.name, est: a.estimate * m, lo: a.ci_low * m, hi: a.ci_high * m, color: i ? "var(--purple)" : "var(--orange)" }));
    const e = r.effect;
    const diff = [{ label: "Difference", est: e.diff * m, lo: e.ci_low * m, hi: e.ci_high * m, color: r.verdict === "clear_difference" ? "var(--green)" : "var(--blue)" }];
    if (r.series && r.series.groups) h += `<div class="card"><p class="title"><span class="ic o">📈</span> Over time</p>${didChart(r.series, m, f1)}
      <div class="cap">Each line = one group's smoothed daily value. Dashed = the change date. If the lines were running side by side before it, the gap is a fair yardstick.</div></div>`;
    else if (r.series) h += `<div class="card"><p class="title"><span class="ic o">📈</span> Over time</p>${seriesChart(r.series, m, f1)}
      <div class="cap">Dots = each day. Lines = smoothed. Dotted = typical day, before and after (whole weeks only).</div></div>`;
    h += `<div class="card"><p class="title"><span class="ic p">📊</span> The picture</p><div class="charts">
      <div><p class="ct">${esc(r.outcome_label[0].toUpperCase() + r.outcome_label.slice(1))}</p>${intervalChart(arms, { fmt: armFmt, aria: "Result per group with likely range", floor0: pts && !did })}<div class="cap">Dot = what we saw. Line = likely range.</div></div>
      <div><p class="ct">The difference</p>${intervalChart(diff, { fmt: fd, zero: true, aria: "Difference with likely range" })}<div class="cap">Line touches the dashed 0 = could be no change.</div></div>
    </div></div>`;
  }

  if (r.mode === "right_answer" && r.robustness.length) {
    h += `<div class="card"><p class="title"><span class="ic g">🧪</span> Cross-checks</p>
      ${r.robustness.map((x) => item(x.weak ? "🤷" : x.agrees ? "✅" : "⚠️", x.name, x.result + " " + x.description)).join("")}</div>`;
  }

  if (r.mode === "research" && ok) {
    h += `<div class="card"><p class="title"><span class="ic b">🔍</span> Who's different?</p><p class="muted" style="margin:0 0 10px;font-weight:700">${esc(r.segment_note)}</p>
      ${r.segments.length ? `<div class="scroll"><table><thead><tr><th>Slice</th><th>${["before_after", "diff_in_diff"].includes(r.analysis) ? "Weeks" : "Rows"}</th><th>Difference</th><th>If nothing changed*</th></tr></thead><tbody>
      ${r.segments.map((s) => `<tr class="${s.flagged ? "flag" : ""}"><td>${s.flagged ? "⭐ " : ""}<b>${esc(s.column)}</b> = ${esc(s.level)}</td><td>${s.n_control.toLocaleString()} / ${s.n_treatment.toLocaleString()}</td>
        <td class="v">${fd(s.diff * m)} <span class="muted" style="font-weight:600">(${fd(s.ci_low * m)} to ${fd(s.ci_high * m)})</span></td><td>${s.p_adj < 0.001 ? "&lt; 0.1%" : (s.p_adj * 100).toFixed(0) + "%"}</td></tr>`).join("")}</tbody></table></div>
      <div class="cap">*How often a gap this big would appear, adjusted for checking many slices.</div>` : ""}</div>`;
  }

  // checks / method tabs
  const checks = r.checks.map((c) => item(STATUS[c.status], `${CHECK_EMOJI[c.name] || "🔎"} ${c.name}`, c.message)).join("");
  const assumptions = r.methods.length
    ? `<div class="legend">✅ checked · ⚠️ concern · 🙋 you confirm</div>` + r.methods.map((mt) =>
        `<div class="mblock"><div class="mname">🧪 ${esc(mt.name)}</div>${mt.assumptions.map((a) => item(ASSUME[a.status], a.text)).join("")}</div>`).join("")
    : `<p class="muted">Nothing ran.</p>`;
  const defTable = (key, head) => `<div class="scroll"><table><thead><tr><th>Number</th><th>Value</th><th>${head}</th></tr></thead><tbody>
      ${r.audit.map((a) => `<tr><td>${esc(a.label)}</td><td class="v">${esc(a.value)}</td><td>${esc(a[key])}</td></tr>`).join("")}</tbody></table></div>`;
  const rp = r.repro || {}, ver = rp.versions || {};
  const repro = r.audit.length ? `
      <div class="fp">🔖 Data fingerprint <code>${esc((rp.data_sha256 || "n/a").slice(0, 16))}</code> · ${(rp.rows_used || 0).toLocaleString()} rows${rp.weeks_used ? " · " + esc(rp.weeks_used) + " weeks" : ""} · seed ${esc(rp.seed)} ·
        ${Object.entries(ver).map(([k, v]) => `${esc(k)} ${esc(v)}`).join(" · ")}</div>
      <div class="scroll"><table><thead><tr><th>Number</th><th>How</th></tr></thead><tbody>
        ${r.audit.map((a) => `<tr><td>${esc(a.label)}</td><td>${esc(a.method)}<br><code>${esc(a.code)}</code></td></tr>`).join("")}</tbody></table></div>
      <div class="row" style="margin-top:14px"><button class="btn soft" id="copyscript">📋 Copy script</button><button class="btn soft" id="dlscript">⬇️ Download .py</button></div>
      <pre id="script">${esc(r.script)}</pre>` : `<p class="muted">Nothing ran.</p>`;

  h += `<div class="card"><div class="tabbar" data-g="main"><button class="tab on" data-t="checks">🩺 Checks</button><button class="tab" data-t="method">🧰 Method</button></div>
    <div class="panel" data-g="main" data-t="checks">${checks}
      ${r.causal_label ? `<div class="box"><b>🎲 Cause?</b>${esc(r.causal_label)}</div>` : ""}
      ${r.cannot_tell.length ? `<div class="box"><b>🚫 Can't tell you</b><ul>${r.cannot_tell.map((t) => `<li>${esc(t)}</li>`).join("")}</ul></div>` : ""}</div>
    <div class="panel hidden" data-g="main" data-t="method">
      <div class="tabbar sub" data-g="meth"><button class="tab on" data-t="a">🧱 Assumptions</button><button class="tab" data-t="t">🎓 Technical</button><button class="tab" data-t="p">💬 In practice</button><button class="tab" data-t="r">🔁 Reproduce</button></div>
      <div class="panel" data-g="meth" data-t="a">${assumptions}</div>
      <div class="panel hidden" data-g="meth" data-t="t">${r.audit.length ? defTable("technical", "Definition") : ""}</div>
      <div class="panel hidden" data-g="meth" data-t="p">${r.audit.length ? defTable("plain", "Means") : ""}</div>
      <div class="panel hidden" data-g="meth" data-t="r">${repro}</div>
    </div></div>`;

  if (r.mode === "quick" && r.caveats.length) {
    h += `<div class="card caveats"><p class="title"><span class="ic o">⚠️</span> Caveats</p><ul>${r.caveats.map((t) => `<li>${esc(t)}</li>`).join("")}</ul></div>`;
  }

  root.innerHTML = h;
  bindTabs(root);
  const cs = $("copyscript"); if (cs) cs.onclick = () => { navigator.clipboard.writeText(r.script); cs.textContent = "✅ Copied"; };
  const dl = $("dlscript"); if (dl) dl.onclick = () => {
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([r.script], { type: "text/x-python" }));
    a.download = "databoarder_repro.py"; a.click(); URL.revokeObjectURL(a.href);
  };
  root.querySelectorAll("[data-rm]").forEach((b) => (b.onclick = async () => { state.mode = b.dataset.rm; renderModes(); await loadQuestions(); await run(); }));
  const ch = $("change"); if (ch) ch.onclick = () => openConfirm([]);
  root.scrollIntoView({ behavior: "smooth", block: "start" });
}
</script>
</body>
</html>
